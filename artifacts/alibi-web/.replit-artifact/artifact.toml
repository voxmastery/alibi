kind = "web"
previewPath = "/"
title = "Alibi"
description = "The existing vanilla HTML and JavaScript Alibi vendor diligence interface, registered as a publishable web frontend. Express continues to provide the uploaded-data API; no React rewrite or new application features."
version = "1.0.0"
id = "artifacts/alibi-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18332

[services.development]
run = "pnpm --filter @workspace/alibi-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alibi-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/alibi-web/public"


[services.env]
PORT = "18332"
BASE_PATH = "/"
